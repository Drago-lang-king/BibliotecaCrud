{% extends "base.html" %}


{% block content %}

<h1>Libros</h1>

<a href="{{url_for('nuevo_libro')}}" class="btn btn-success mb-2">Agregar Libro</a>

<table class="table table-striped table-hover mt-4">
  <thead class="table-success">
    <th>Id</th>
    <th>Titulo</th>
    <th>Autor</th>
    <th>Año</th>
    <th>Acciones</th>
  </thead>
  <tbody>
    {% for libro in libros %}
    <tr>
      <td>{{ libro.id }}</td>
      <td>{{ libro.titulo }}</td>
      <td>{{ libro.autor }}</td>
      <td>{{ libro.anio }}</td>
      <td>
        <a href="{{ url_for('editar_libro', id=libro.id)}}" class="btn btn-warning">Editar</a>  
        <a href="{{ url_for('eliminar_libro', id=libro.id)}}" class="btn btn-danger" onclick="return(confirm('Estas seguro de eliminar'))">Eliminar</a>  
      </td>
    </tr>
    {% endfor %}
  </tbody>


</table>

{% endblock %}

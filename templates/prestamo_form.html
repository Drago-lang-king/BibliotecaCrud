{% extends "base.html" %} 
{% block content %}

<div class="card shadow mt-4">
    <div class="card-header bg-success text-white">
        <h2 class="mb-0">
            {% if prestamo %}
                Editar prestamo
            {% else %}
                Nuevo Prestamo
            {% endif %}
        </h2>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <select name="usuario_id" class="form-select" required>
                    <option value="">--seleccione usuario--</option>
                    {% for usuario in usuarios %}
                    <option value="{{ usuario.id }}">{{ usuario.nombre }} {{ usuario.apellidos }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Libro</label>
                <select name="libro_id" class="form-select" required>
                    <option value="">--seleccione un libro--</option>
                    {% for libro in libros %}
                    <option value="{{ libro.id }}">{{ libro.titulo }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha de Pretamo</label>
                <input type="date" name="fecha_prestamo" class="form-control" required>                
            </div>
            
            <div class="mb-3">
                <label class="form-label">Fecha de Devolucion</label>
                <input type="date" name="fecha_devolucion" class="form-control" required>                
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>

            <a href="{{ url_for('prestamos') }}" class="btn btn-secondary">Cancelar</a>

        </form>
    </div>
</div>

{% endblock %}

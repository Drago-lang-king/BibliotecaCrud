{% extends "base.html" %}

{% block content %}

<div class="card-header bg-success text-white" style="border-radius: 10px;">
    <h2 class="m-3">
        {% if usuario %}
            Editar Usuario
        {% else %}
            Nuevo Usuario
        {% endif %}
    </h2>
</div>
<div class="card-body">
    <form action="" method="POST">

        <div class="mb-3">
            <label for="" class="form-label">Ci</label>
            <input type="text" class="form-control" name="carnet" value="{{ usuario.carnet if usuario else ' ' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" value="{{ usuario.nombre if usuario else ''}}" required>
        </div>

        <div class="mb-3">
            <label for="" class="form-label">Apellidos</label>
            <input type="text" class="form-control" name="apellidos" value="{{ usuario.apellidos if usuario else ' ' }}" required>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>

        <a href="{{url_for('usuarios') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
